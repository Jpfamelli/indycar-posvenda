# Testes das funções puras do Comunicar a cada push (sem banco, sem segredo).
name: testes
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxe
        run: node --check server.js && node --check dados.js && node --check supabase.js
      - name: Testes
        run: node --test scripts/testes.mjs
